<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Analytics · PostReady AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="shell"></div>
  <script src="/app.js"></script>
  <script>
    shell.innerHTML = appShell('analytics');
    const app = $('#appContent');
    app.innerHTML = thinkingHTML('Crunching your numbers');

    async function load() {
      const user = await requireAuth();
      if (!user) return;
      const [d, h] = await Promise.all([api('/api/analytics'), api('/api/health')]);
      const a = d.analytics;

      app.innerHTML = `
        <div class="page-head">
          <div>
            <span class="kicker">Usage data</span>
            <h1 class="main-title">Analytics</h1>
            <p class="muted">Use this to check if people actually generate and plan posts.</p>
          </div>
        </div>
        <div class="stats">
          ${stat('Credits', a.credits)}
          ${stat('Generations', a.totalGenerations)}
          ${stat('Schedules', a.totalSchedules)}
          ${stat('Plan', a.plan)}
        </div>
        <div class="grid two section">
          <div class="card">
            <h3>Last 30 days</h3>
            <div class="stats" style="grid-template-columns:1fr 1fr">
              ${stat('Generated', a.last30DaysGenerations)}
              ${stat('Scheduled', a.last30DaysSchedules)}
            </div>
          </div>
          <div class="card">
            <h3>Top usage</h3>
            <p><b>Platform:</b> ${escapeHtml(a.mostUsedPlatform)}</p>
            <p><b>Niche:</b> ${escapeHtml(a.mostUsedNiche)}</p>
            <p><b>AI provider:</b> ${escapeHtml(h.aiProvider)}</p>
          </div>
        </div>
        <div class="card">
          <h3>Next analytics to add</h3>
          <p class="muted">In production, connect PostHog/Google Analytics and track activation: signup &rarr; first generation &rarr; second generation &rarr; payment.</p>
        </div>`;
    }

    load();
  </script>
</body>
</html>
