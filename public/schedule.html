<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Planner · PostReady AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="shell"></div>
  <script src="/app.js"></script>
  <script>
    shell.innerHTML = appShell('schedule');
    const app = $('#appContent');
    app.innerHTML = thinkingHTML('Loading your planner');

    async function load() {
      const user = await requireAuth();
      if (!user) return;
      const d = await api('/api/schedules');

      app.innerHTML = `
        <div class="page-head">
          <div>
            <span class="kicker">Content planner</span>
            <h1 class="main-title">Schedule planner</h1>
            <p class="muted">This stores planned posts. Auto-posting is not connected yet.</p>
          </div>
        </div>
        <div class="grid two">
          <div class="card">
            <form id="form">
              <label>Post content / note</label>
              <textarea id="content" required placeholder="Paste caption or write what you want to post..."></textarea>
              <label>Platform</label>
              <select id="platform"><option>Instagram</option><option>YouTube</option><option>LinkedIn</option><option>Facebook</option><option>X</option><option>WhatsApp</option></select>
              <label>Date and time</label>
              <input id="dateTime" type="datetime-local" required>
              <button class="btn primary" style="margin-top:16px;width:100%" type="submit">
                <span class="btnLabel">Save schedule</span>
              </button>
              <p id="msg" class="ok"></p>
            </form>
          </div>
          <div class="card">
            <h3>Planned posts</h3>
            <div id="list">${d.schedules.length ? d.schedules.map(s => `<div class="result"><b>${escapeHtml(s.platform)}</b><br><span class="muted small">${new Date(s.dateTime).toLocaleString()}</span><br>${escapeHtml(s.content)}</div>`).join('') : '<div class="empty">No planned posts yet.</div>'}</div>
          </div>
        </div>`;
      form.onsubmit = save;
    }

    async function save(e) {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      const label = submitBtn.querySelector('.btnLabel');
      submitBtn.disabled = true;
      label.innerHTML = '<span class="spinner"></span> Saving';
      try {
        await api('/api/schedules', { method: 'POST', body: JSON.stringify({ content: content.value, platform: platform.value, dateTime: dateTime.value }) });
        toast('Schedule saved');
        load();
      } catch (err) {
        msg.className = 'error';
        msg.textContent = err.message;
        submitBtn.disabled = false;
        label.textContent = 'Save schedule';
      }
    }

    load();
  </script>
</body>
</html>
