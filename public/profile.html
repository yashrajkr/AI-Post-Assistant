<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brand Voice · PostReady AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="shell"></div>
  <script src="/app.js"></script>
  <script>
    shell.innerHTML = appShell('profile');
    const app = $('#appContent');
    app.innerHTML = thinkingHTML('Loading your brand voice');

    async function load() {
      const user = await requireAuth();
      if (!user) return;

      app.innerHTML = `
        <div class="page-head">
          <div>
            <span class="kicker">Personalization</span>
            <h1 class="main-title">Brand voice</h1>
            <p class="muted">Save your tone once. The generator will use it in captions and CTAs.</p>
          </div>
        </div>
        <div class="grid two">
          <div class="card">
            <form id="form">
              <label>Your name</label>
              <input id="name" value="${escapeHtml(user.name || '')}">
              <label>Brand name</label>
              <input id="brandName" value="${escapeHtml(user.brandVoice?.brandName || '')}" placeholder="Example: Yashraj AI">
              <label>Tagline</label>
              <input id="tagline" value="${escapeHtml(user.brandVoice?.tagline || '')}" placeholder="Example: AI learning made simple">
              <label>Preferred tone</label>
              <input id="tone" value="${escapeHtml(user.brandVoice?.tone || 'simple and practical')}" placeholder="simple, practical, friendly">
              <button class="btn primary" style="margin-top:16px;width:100%" type="submit">
                <span class="btnLabel">Save brand voice</span>
              </button>
              <p id="msg" class="ok"></p>
            </form>
          </div>
          <div class="card">
            <h3>Example style</h3>
            <div class="result">
              <b>${escapeHtml(user.brandVoice?.brandName || 'Your Brand')}</b><br>
              ${escapeHtml(user.brandVoice?.tagline || 'Your tagline appears here')}<br>
              <span class="muted">Tone: ${escapeHtml(user.brandVoice?.tone || 'simple and practical')}</span>
            </div>
            <p class="muted">Tip: keep your brand voice short. Example: &ldquo;simple, Indian audience, practical, no fake viral lines&rdquo;.</p>
          </div>
        </div>`;
      form.onsubmit = save;
    }

    async function save(e) {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      const label = submitBtn.querySelector('.btnLabel');
      submitBtn.disabled = true;
      label.innerHTML = '<span class="spinner"></span> Saving';
      try {
        await api('/api/profile', { method: 'POST', body: JSON.stringify({ name: name.value, brandName: brandName.value, tagline: tagline.value, tone: tone.value }) });
        msg.textContent = 'Saved successfully';
        toast('Profile saved');
      } finally {
        submitBtn.disabled = false;
        label.textContent = 'Save brand voice';
      }
    }

    load();
  </script>
</body>
</html>
